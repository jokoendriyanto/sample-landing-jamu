<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Ilustrasi kemasan jamu pegal linu tampak depan dan samping">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#EAE5D7"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7E5119"/>
      <stop offset="30%" stop-color="#BC853C"/>
      <stop offset="55%" stop-color="#8E5A22"/>
      <stop offset="100%" stop-color="#61390F"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C4614"/>
      <stop offset="100%" stop-color="#4B2E0C"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg3)"/>
  <ellipse cx="300" cy="512" rx="180" ry="26" fill="#252B27" opacity="0.1"/>

  <!-- back/second bottle -->
  <g transform="translate(120,20)">
    <rect x="120" y="150" width="66" height="28" rx="7" fill="#1C4735"/>
    <rect x="126" y="176" width="54" height="28" fill="url(#glassB)"/>
    <path d="M126 204 h54 q8 0 10 8 l8 38 q24 12 29 40 l12 132 q2 22-21 22 h-102 q-23 0-21-22 l12-132 q5-28 29-40 l8-38 q2-8 10-8 Z"
          fill="url(#glassB)"/>
    <rect x="106" y="330" width="94" height="78" rx="7" fill="#E8E0CC" opacity="0.85"/>
  </g>

  <!-- front bottle -->
  <g transform="translate(28,0)">
    <rect x="212" y="120" width="76" height="32" rx="8" fill="#245B43"/>
    <rect x="212" y="120" width="76" height="11" rx="5.5" fill="#2F7053"/>
    <rect x="220" y="150" width="60" height="30" fill="url(#glassA)"/>
    <path d="M220 180 h60 q10 0 12 10 l9 44 q28 14 34 46 l14 154 q2 26-24 26 h-124 q-26 0-24-26 l14-154 q6-32 34-46 l9-44 q2-10 12-10 Z"
          fill="url(#glassA)"/>
    <path d="M232 240 q-9 44-13 96 l-8 118 q-2 12 8 12 l6 0 q-7-78 1-134 q6-48 14-80 Z"
