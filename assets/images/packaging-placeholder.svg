    <rect x="170" y="322" width="152" height="132" rx="11" fill="#FBF7EC" stroke="#D9CFB6" stroke-width="1.6"/>
    <circle cx="246" cy="356" r="18" fill="none" stroke="#245B43" stroke-width="2.6"/>
    <path d="M237 363c7-11 11-13 18-17" stroke="#245B43" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <rect x="196" y="388" width="100" height="8" rx="4" fill="#245B43" opacity="0.72"/>
    <rect x="208" y="404" width="76" height="5" rx="2.5" fill="#737B75" opacity="0.5"/>
    <rect x="218" y="417" width="56" height="5" rx="2.5" fill="#737B75" opacity="0.36"/>
    <rect x="228" y="432" width="36" height="4" rx="2" fill="#C69B53" opacity="0.85"/>
  </g>

  <text x="300" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
        fill="#737B75" opacity="0.75" letter-spacing="1.6">FOTO KEMASAN — PLACEHOLDER</text>
</svg>
