<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="Ilustrasi bahan baku herbal untuk jamu tradisional">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F1"/>
      <stop offset="100%" stop-color="#EFEBDF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg2)"/>

  <!-- table surface -->
  <rect y="250" width="600" height="200" fill="#EDE7D8"/>
  <ellipse cx="300" cy="252" rx="240" ry="26" fill="#E2DBC8" opacity="0.7"/>

  <!-- wooden board -->
  <ellipse cx="300" cy="290" rx="180" ry="52" fill="#C9A876" opacity="0.35"/>

  <!-- turmeric roots -->
  <g stroke="#B07B18" stroke-width="2" stroke-linecap="round">
    <path d="M118 300 q18-26 46-20 q24 6 22 26 q-2 22-28 24 q-28 2-40-30Z" fill="#D9A233"/>
    <path d="M150 268 q10-18 30-16" fill="none"/>
    <path d="M104 316 q-14 10-12 26" fill="none"/>
  </g>

  <!-- ginger -->
  <path d="M210 320 q-16-34 12-50 q22-13 40 4 q16 15 6 36 q-11 22-36 22 q-16 0-22-12Z" fill="#D2B48C" stroke="#B99A70" stroke-width="2"/>
  <path d="M228 300 q8-10 20-6" stroke="#B99A70" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- lemongrass stalks -->
  <g stroke-linecap="round">
    <path d="M330 300 l64-120" stroke="#A8BE72" stroke-width="9"/>
    <path d="M348 304 l70-104" stroke="#BBD086" stroke-width="8"/>
    <path d="M364 310 l58-92" stroke="#9DB565" stroke-width="7"/>
  </g>

  <!-- pandan leaves -->
  <g fill="#5F8A5E" opacity="0.85">
    <path d="M436 320 q30-70 84-92 q-8 66-56 100 q-18 12-28-8Z"/>
    <path d="M452 330 q40-52 92-58 q-18 56-68 76 q-20 8-24-18Z" opacity="0.7"/>
  </g>

  <!-- cinnamon sticks -->
  <g fill="#8B5A2B" stroke="#6E4420" stroke-width="1.6">
    <rect x="76" y="180" width="96" height="18" rx="9" transform="rotate(-16 76 180)"/>
    <rect x="84" y="204" width="88" height="15" rx="7.5" transform="rotate(-11 84 204)" opacity="0.85"/>
  </g>

  <!-- small bowl of dried herbs -->
  <ellipse cx="472" cy="352" rx="52" ry="20" fill="#8B6B45"/>
  <ellipse cx="472" cy="346" rx="46" ry="16" fill="#A5825A"/>
  <g fill="#6B4B2A" opacity="0.75">
    <circle cx="456" cy="344" r="4"/><circle cx="470" cy="340" r="3.6"/>
    <circle cx="484" cy="345" r="4.2"/><circle cx="462" cy="350" r="3.2"/>
    <circle cx="478" cy="351" r="3.4"/>
  </g>

  <!-- scattered leaves accent -->
  <path d="M330 386 q26-16 50-8 q-16 20-42 22 q-14 0-8-14Z" fill="#8BA88E" opacity="0.55"/>
  <path d="M540 200 q22-22 46-18 q-12 26-38 32 q-12 2-8-14Z" fill="#8BA88E" opacity="0.45"/>

  <!-- watermark -->
  <text x="300" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11"
        fill="#737B75" opacity="0.75" letter-spacing="1.6">FOTO BAHAN — PLACEHOLDER</text>
</svg>
